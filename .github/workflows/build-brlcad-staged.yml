name: Manhardt staged BRL-CAD schema closure
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manhardt-brlcad-p1-offline-preflight
  cancel-in-progress: false
jobs:
  source-preflight:
    if: >-
      github.repository == 'gr8form1/manhardt-brlcad-build' &&
      github.ref == 'refs/heads/feature/step-export-p1-signedzero' &&
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed commit, public repo only
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Confirm P1 boundaries, syntax and source pins without network or native build
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          mkdir -p p1-preflight
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from sys import path
          path.insert(0, str(Path.cwd() / 'ci'))
          from step_export_p1_patch import PIN
          pins = json.loads(Path('pins/sources.json').read_text())
          assert PIN == pins['brlcad_commit'] == 'bc130e1e7a9f179fe95fb42cde1a7d3becb512df'
          paths = ('ci/step_export_p1_patch.py', 'ci/p1_independent_occt_readback.py',
                   'ci/build_geometry_tools.py', 'tests/test_step_export_p1_patch.py',
                   '.github/workflows/build-brlcad-staged.yml', 'STEP_EXPORT_P1.md')
          build_source = Path('ci/build_geometry_tools.py').read_text()
          assert 'apply_source_patch(brl, pins[\'brlcad_commit\'])' in build_source
          workflow = Path('.github/workflows/build-brlcad-staged.yml').read_text()
          assert workflow.count("github.ref == 'refs/heads/feature/step-export-p1-signedzero'") == 2
          assert not any(line.lstrip().startswith('run: python3 ci/build_geometry_tools.py') for line in workflow.splitlines())
          assert "workflow_dispatch:" in workflow
          out = {'schema': 'MANHARDT_ADR001_P1_OFFLINE_PREFLIGHT/1',
                 'result': 'STATIC_CONTROLS_ONLY_NOT_NATIVE_ACCEPTANCE',
                 'github_sha': os.environ['GITHUB_SHA'],
                 'upstream_pin': PIN,
                 'inputs': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          Path('p1-preflight/attestation.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True,indent=2))
          PY
          python3 -m py_compile ci/step_export_p1_patch.py ci/p1_independent_occt_readback.py
      - name: Complete standalone source and compiled-helper regressions
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 -m unittest discover -s tests -v 2>&1 | tee p1-preflight/unit-tests.log
      - name: Preserve small immutable preflight evidence, even on test failure
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manhardt-p1-preflight-${{ github.sha }}-${{ github.run_id }}
          path: p1-preflight/
          if-no-files-found: warn
          include-hidden-files: false
          compression-level: 6
          retention-days: 7
