name: Manhardt P1 Drive-80MB custody split (no rebuild)
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: manhardt-p1-run42897744666-drive80-custody-split
  cancel-in-progress: false
jobs:
  split:
    if: >-
      github.repository == 'gr8form1/manhardt-brlcad-build' &&
      github.ref == 'refs/heads/feature/p1-run42897744666-drive-80m' &&
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact selected source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Retrieve successful P1 artifact from same public repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: manhardt-geometry-tools-42897744666-1
          run-id: '42897744666'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact
      - name: Source-locked integrity screen, TAR, SHA-256 and bounded segmentation
        id: split
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: python3 ci/custody_split_existing.py
      - name: Preserve custody manifest (small)
        if: ${{ steps.split.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1drive80-custody-manifest-${{ github.run_id }}
          path: |
            custody/CUSTODY_MANIFEST.json
            custody/README.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve segmented source artifact part 000
        if: ${{ steps.split.outcome == 'success' && fromJSON(steps.split.outputs.count) > 0 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1drive80-custody-part-000-${{ github.run_id }}
          path: custody/p1-part-000.bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve segmented source artifact part 001
        if: ${{ steps.split.outcome == 'success' && fromJSON(steps.split.outputs.count) > 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1drive80-custody-part-001-${{ github.run_id }}
          path: custody/p1-part-001.bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
