name: M1 IR-01 final synthetic containment qualification
on:
  workflow_dispatch:
concurrency:
  group: m1-ir01-synthetic-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run bounded adversarial synthetic qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3.12 - <<'PY' 2>&1 | tee evidence/qualification.log
          import os, pathlib, subprocess, time, json, signal, sys
          from datetime import datetime,timezone
          evidence=pathlib.Path("evidence")
          unit="m1-ir01-final-"+os.environ["GITHUB_RUN_ID"]+"-"+os.environ.get("GITHUB_RUN_ATTEMPT","1")
          service=unit+".service"
          record={"run_id":os.environ["GITHUB_RUN_ID"],"unit":service,"status":"INCOMPLETE","checks":{}}
          def run(args,timeout=8,check=True):
              return subprocess.run(args,text=True,capture_output=True,timeout=timeout,check=check)
          def sudo(*args,timeout=8):
              return run(["sudo","-n",*args],timeout=timeout).stdout.strip()
          def prop(name):
              return sudo("systemctl","show",service,"-p",name,"--value")
          def save():
              record["completed_utc"]=datetime.now(timezone.utc).isoformat()
              (evidence/"result.json").write_text(json.dumps(record,indent=2,sort_keys=True)+"\n")
          attempted=False
          cg=None
          failures=[]
          cleanup=[]
          probe_seen=False
          start=time.monotonic()
          try:
              assert sys.version_info[:2]==(3,12)
              sudo("-v")
              # No packages, no repository checkout, no IR-01 source, no host service edits.
              # Parent and child both ignore SIGTERM, testing cgroup SIGKILL fallback.
              # A synthetic, source-free restriction probe; no protected paths are changed.
              code='''
          import json,os,pathlib,signal,socket,subprocess,time
          checks={}
          try:
              fd=os.open('/etc/hostname',os.O_WRONLY)
              os.close(fd);checks['etc_write_denied']=False
          except PermissionError:checks['etc_write_denied']=True
          try:
              sock=socket.socket(socket.AF_INET,socket.SOCK_STREAM);sock.close();checks['inet_socket_denied']=False
          except OSError:checks['inet_socket_denied']=True
          tmp=pathlib.Path('/tmp/m1-ir01-synthetic-probe')
          try:tmp.write_text('ok');checks['tmp_writable']=tmp.read_text()=='ok';tmp.unlink()
          except OSError:checks['tmp_writable']=False
          print('IR01_PROBE '+json.dumps(checks,sort_keys=True),flush=True)
          signal.signal(signal.SIGTERM,signal.SIG_IGN)
          subprocess.Popen(['/usr/bin/python3.12','-c','import signal,time;signal.signal(signal.SIGTERM,signal.SIG_IGN);time.sleep(90)'])
          time.sleep(90)'''
              import textwrap
              code=textwrap.dedent(code)

              args=["sudo","-n","systemd-run","--unit="+unit,
                    "--property=User="+str(os.getuid()),
                    "--property=MemoryAccounting=yes",
                    "--property=MemoryMax=1073741824",
                    "--property=MemorySwapMax=0",
                    "--property=TasksMax=32",
                    "--property=RuntimeMaxSec=3",
                    "--property=TimeoutStopSec=1",
                    "--property=KillMode=control-group",
                    "--property=SendSIGKILL=yes",
                    "--property=NoNewPrivileges=yes",
                    "--property=ProtectSystem=strict",
                    "--property=ProtectHome=yes",
                    "--property=PrivateTmp=yes",
                    "--property=RestrictAddressFamilies=AF_UNIX",
                    "--property=IPAddressDeny=any",
                    "--property=CapabilityBoundingSet=",
                    "/usr/bin/python3.12","-c",code]
              attempted=True  # Set BEFORE submission; ambiguous timeout still triggers cleanup.
              result=run(args,timeout=8)
              print("UNIT_STARTED",service,result.stdout.strip(),flush=True)
              for _ in range(40):
                  cg=prop("ControlGroup")
                  if cg.startswith("/system.slice/"+service) and pathlib.Path("/sys/fs/cgroup"+cg+"/cgroup.procs").exists():
                      pids=pathlib.Path("/sys/fs/cgroup"+cg+"/cgroup.procs").read_text().split()
                      if len(pids)>=2:break
                  time.sleep(.1)
              else:raise RuntimeError("parent and descendant not both observed")
              path=pathlib.Path("/sys/fs/cgroup"+cg)
              mem=(path/"memory.max").read_text().strip()
              swap=(path/"memory.swap.max").read_text().strip()
              record["checks"]["dedicated_cgroup"]=cg
              record["checks"]["observed_process_count"]=len(pids)
              record["checks"]["memory_max"]=mem
              record["checks"]["swap_max"]=swap
              record["checks"]["kill_mode"]=prop("KillMode")
              record["checks"]["send_sigkill"]=prop("SendSIGKILL")
              record["checks"]["runtime"]=prop("RuntimeMaxUSec")
              record["checks"]["stop_timeout"]=prop("TimeoutStopUSec")
              for key,expected in {"NoNewPrivileges":"yes","ProtectSystem":"strict",
                                   "ProtectHome":"yes","PrivateTmp":"yes",
                                   "IPAddressDeny":"any"}.items():
                  observed=prop(key)
                  record["checks"]["sandbox_"+key]=observed
                  assert observed==expected,(key,observed,expected)
              families=prop("RestrictAddressFamilies")
              record["checks"]["sandbox_RestrictAddressFamilies"]=families
              assert families.strip()=="AF_UNIX",families
              record["checks"]["process_ids"]=[int(pid) for pid in pids]
              print("OBSERVED",json.dumps(record["checks"],sort_keys=True),flush=True)
              assert mem=="1073741824" and swap=="0"
              assert record["checks"]["kill_mode"]=="control-group"
              assert record["checks"]["send_sigkill"]=="yes"
              assert record["checks"]["runtime"]=="3s"
              assert record["checks"]["stop_timeout"]=="1s"
              # A 12-second independent watchdog bounds observation of a 3s systemd expiry.
              deadline=start+12
              while time.monotonic()<deadline:
                  state=prop("ActiveState")
                  remaining=pathlib.Path("/sys/fs/cgroup"+cg+"/cgroup.procs")
                  if state in ("failed","inactive") and (not remaining.exists() or not remaining.read_text().strip()):
                      break
                  time.sleep(.15)
              else:raise RuntimeError("independent 12-second watchdog: unit/descendants not stopped")
              elapsed=time.monotonic()-start
              record["checks"]["expiry_observed_seconds"]=round(elapsed,3)
              record["checks"]["final_state"]=state
              journal=sudo("journalctl","-u",service,"--no-pager","-o","cat",timeout=8)
              (evidence/"service-journal.txt").write_text(journal+"\n")
              import re
              matches=re.findall(r"^IR01_PROBE (\{[^\n]+\})$",journal,re.M)
              assert len(matches)==1,("probe records",len(matches))
              probe=json.loads(matches[0]);record["checks"]["restriction_probe"]=probe
              assert probe=={"etc_write_denied":True,"inet_socket_denied":True,"tmp_writable":True},probe
              record["status"]="PASS_SYNTHETIC"
              print("PASS: bounded runtime expiry and resistant descendant termination",round(elapsed,3),flush=True)
              print("LIMITATION: this does not independently prove a 600-second whole-invocation ceiling",flush=True)
          except BaseException as exc:
              record["status"]="FAIL"
              record["error"]=repr(exc)
              failures.append("qualification: "+repr(exc))
              print("FAIL",repr(exc),flush=True)
          finally:
              # Even a timed-out or ambiguous submission may have created the unit.
              if attempted:
                  for action,command in [
                      ("stop",["systemctl","stop",service]),
                      ("kill",["systemctl","kill","--kill-who=all","--signal=SIGKILL",service]),
                      ("reset_failed",["systemctl","reset-failed",service])]:
                      try:
                          r=run(["sudo","-n",*command],timeout=5,check=False)
                          cleanup.append({"action":action,"returncode":r.returncode,
                                          "stdout":r.stdout[-2000:],"stderr":r.stderr[-2000:]})
                          # A nonzero result is recorded, not silently discarded.
                          # Nonzero for an already-absent unit is diagnostic; final quiescence decides.
                      except BaseException as exc:
                          cleanup.append({"action":action,"error":repr(exc)})
                          failures.append("cleanup "+action+": "+repr(exc))
                  try:
                      state=prop("ActiveState")
                      cg_now=prop("ControlGroup")
                      remaining=(pathlib.Path("/sys/fs/cgroup")/(cg_now or cg or "").lstrip("/")/"cgroup.procs") if (cg_now or cg) else None
                      procs=remaining.read_text().split() if remaining and remaining.exists() else []
                      record["checks"]["cleanup_final_state"]=state
                      record["checks"]["cleanup_remaining_pids"]=procs
                      if state not in ("inactive","failed","") or procs:
                          failures.append("cleanup: workload not quiescent")
                  except BaseException as exc:
                      failures.append("cleanup verification: "+repr(exc))
              record["cleanup"]=cleanup
              record["failures"]=failures
              if failures:record["status"]="FAIL"
              save()
          if failures:raise SystemExit("Synthetic qualification failed; inspect evidence/result.json")
          PY
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-ir01-final-synthetic-qualification-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
